# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto
#monitor=DP-1, 3840x2160, 0x0, 2
#monitor=HDMI-A-1, 3840x2160, 1920x0, 2
#monitor=DP-1,addreserved,0,35,0,0
# the offset position takes into account the scaling value hence 3840/1.5 = 2560
#
monitor=DP-1, 5120x2160@120, 0x0, 2
#monitor=DP-1, 2560@1080, 0x0, 2
#monitor=DP-1, 2560x1080@60, 0x0, 1.6 # recording res?
monitor=,preferred,auto,auto
#monitor=HDMI-A-1, 3840x2160, 0x0, 2

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
xwayland {
  force_zero_scaling = true
}

# Workspaces
workspace=0,name:00-mail,monitor:DP-1,default:true
workspace=1,name:01-main,monitor:DP-1
workspace=2,name:02-browser,monitor:DP-1
workspace=3,name:03-work-browser,monitor:DP-1
workspace=4,name:04-media,monitor:DP-1
workspace=5,name:05-game,monitor:DP-1
workspace=6,name:06-notes,monitor:DP-1
workspace=7,name:07-chrome,monitor:DP-1
workspace=8,name:08-obs,monitor:DP-1
workspace=9,name:09-chat,monitor:DP-1

# Windows to workspaces
windowrule = match:class term-mail, workspace name:00-mail silent
windowrule = match:class term-news, workspace name:00-mail silent
windowrule = match:class ^(firefox)$, workspace name:02-browser silent
windowrule = match:class ^(browser-work)$, workspace name:03-work-browser silent
windowrule = match:class ^(mpv)$, workspace name:04-media silent
windowrule = match:class ^(ffmusic)$, workspace name:04-media silent
windowrule = match:class ^(.*Discord.*)$, workspace name:05-game silent
windowrule = match:class obsidian, workspace name:06-notes silent
windowrule = match:class org.chromium.Chromium, workspace name:07-chrome silent
windowrule = match:class com.obsproject.Studio, workspace name:08-obs silent
windowrule = match:class com.slack.Slack, workspace name:09-chat silent

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
env = XCURSOR_SIZE,24

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = -0.8 # -1.0 - 1.0, 0 means no modification.
}

device {
    name = pixa3854:00-093a:0274-touchpad
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 20
    border_size = 1
    col.active_border = rgb(80e0a7) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    #cursor_inactive_timeout = 10
    resize_on_border = true

    layout = dwindle
}

group {
    col.border_active = rgba(bb66ffee)
    groupbar {
        enabled = true
        col.active = rgba(cdd6f4cc)
        col.inactive = rgb(666699)
        font_size = 6
        height = 14
        font_family = JetBrainsMono Nerd Font Mono
        text_color = rgb(333333)
    }
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    #dim_inactive = true
    active_opacity = 0.95
    inactive_opacity = 0.7

    blur {
        enabled = true
        size = 3
        passes = 1
    }

    #drop_shadow = true
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
    force_split = 2
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
}


# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# $ hyprctl devices
#device:kingsis-peripherals-zowie-gaming-mouse {
#    sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Custom opacity's
#windowrule = opacity 0.94 1,^(Slack)$
#windowrule = opacity 0.94 0.5,^(firefox)$
windowrule = match:class ^(mpv)$, opacity 1.0 override 1.0 override
windowrule = match:class ^(Minecraft)$, opacity 1.0 override 1.0 override

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, C, focuswindow, class:com.slack.Slack
bind = $mainMod, W, killactive
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, I, pin,
bind = $mainMod, G, togglegroup,
bind = $mainMod, N, changegroupactive,
bind = $mainMod, A, movewindoworgroup, l
bind = $mainMod, F, fullscreen,
bind = $mainMod, S, exec, grim -g "$(slurp -d)"
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, Q, exec, $HOME/.config/wofi/wofi-pass -s -c
bind = $mainMod, X, exec, $HOME/.config/wofi/clipboard
bind = $mainMod, V, exec, $HOME/.config/wofi/clipboard save
bind = , mouse:276, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
#bind = $mainMod, P, pseudo, # dwindle
bind = SUPER_SHIFT, J, togglesplit,
bind = SUPER_SHIFT, S, swapsplit,
bind = SUPER, p, setprop, active opaque toggle

# Move focus with mainMod + hjkl
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces
bind = $mainMod, M, workspace, name:00-mail
bind = $mainMod, t, workspace, name:01-main
bind = $mainMod, b, workspace, name:02-browser
bind = $mainMod, o, workspace, name:03-work-browser
bind = $mainMod, 4, workspace, name:04-media
bind = $mainMod, 5, workspace, name:05-game
bind = $mainMod, 6, workspace, name:06-notes
bind = $mainMod, 7, workspace, name:07-chrome
bind = $mainMod, 8, workspace, name:08-obs
bind = $mainMod, 9, workspace, name:09-chat
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, M, movetoworkspace, name:00-mail
bind = $mainMod SHIFT, 1, movetoworkspace, name:01-main
bind = $mainMod SHIFT, 2, movetoworkspace, name:02-browser
bind = $mainMod SHIFT, 3, movetoworkspace, name:03-work-browser
bind = $mainMod SHIFT, 4, movetoworkspace, name:04-media
bind = $mainMod SHIFT, 5, movetoworkspace, name:05-game
bind = $mainMod SHIFT, 6, movetoworkspace, name:06-notes
bind = $mainMod SHIFT, 7, movetoworkspace, name:07-chrome
bind = $mainMod SHIFT, 8, movetoworkspace, name:08-obs
bind = $mainMod SHIFT, 9, movetoworkspace, name:09-chat
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Write some email addresses, the sleep is to give time for SUPER to be released else it will do some crazy stuff
bind = $mainMod, y, exec, wtype -s 400 tom.westcott@gmail.com
bind = $mainMod, u, exec, wtype -s 400 tom@cyberdummy.co.uk

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = CTRL, 8, pass, ^(com\.obsproject\.Studio)$
bind = CTRL, 9, pass, ^(com\.obsproject\.Studio)$
bind = CTRL, 0, pass, ^(com\.obsproject\.Studio)$
#windowrule2 = forceinput, ^(com\.discordapp\.Discord)$
#bind = CTRL SHIFT, m, pass, ^(com\.discordapp\.Discord)$

# scratch pad
#exec-once=wezterm start --class=term-dropdown
#$dropterm=term-dropdown
#windowrule=workspace name:media,$dropterm
#windowrule=float,$dropterm
windowrule = match:class showmethekey-gtk, float on
windowrule = match:class showmethekey-gtk, pin on
windowrule = match:class showmethekey-gtk, move 100%-w-20
#windowrule=size 75% 20%,$dropterm
#windowrule=move 12.5% -469,$dropterm
#bind=$mainMod,E,exec,$HOME/.config/hypr/scripts/dropdown.sh
exec-once=[workspace special silent; size 75% 20%;move 12.5% 40] foot
bind=$mainMod,E,togglespecialworkspace

exec-once=waybar
exec-once=dunst
exec-once=gammastep
exec-once=hyprpaper
#exec-once=hypridle
exec-once=$HOME/.local/bin/dummy ff

windowrule=match:class term-main, workspace name:01-main
exec-once=foot -a term-mail tmuxinator start mail
exec-once=foot -a term-main
#exec-once=dummy background flatpak run com.slack.Slack --force-device-scale-factor=2 --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once=flatpak run com.discordapp.Discord --enable-features=UseOzonePlatform --ozone-platform=wayland
exec-once=foot -a term-news newsboat
exec=hyprctl dispatch workspace name:01-main
exec-once=flatpak run com.slack.Slack --enable-features=UseOzonePlatform --ozone-platform=wayland
